<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Квесты</title>
<style>
:root{--bg:#f4f3fb;--card:#fff;--tx:#1b1a2e;--mut:#77748f;--ac:#6c4cf5;--ok:#1fb86a;--bd:#e4e2f0;--bad:#e5484d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13121d;--card:#1e1d2d;--tx:#f1f0fa;--mut:#9a97b5;--bd:#2d2b42}}
:root[data-theme="dark"]{--bg:#13121d;--card:#1e1d2d;--tx:#f1f0fa;--mut:#9a97b5;--bd:#2d2b42}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:12px 16px 8px;max-width:560px;margin:0 auto}
.sb{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--bd);border-radius:999px;padding:4px 6px 4px 14px;box-shadow:0 2px 10px rgba(108,76,245,.12)}
.sb input{border:0;background:none;padding:10px 0;outline:0}.sb button{padding:9px 14px;border-radius:999px}
#app{max-width:560px;margin:0 auto;padding:4px 16px 90px}
h1{font-size:24px;margin:8px 0 14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;margin-bottom:10px}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:10px 14px;background:var(--ac);color:#fff}
button.g{background:transparent;color:var(--ac);padding:6px 8px}button.d{background:transparent;color:var(--bad);padding:6px 8px}
input{font:inherit;width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
.row{display:flex;gap:8px;align-items:center}.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ok));transition:width .4s}
.tabs{display:flex;border-bottom:1px solid var(--bd);margin:12px 0 4px}
.tabs button{flex:1;background:none;color:var(--mut);border-radius:0;padding:10px 4px;border-bottom:3px solid transparent}
.tabs button.a{color:var(--ac);border-color:var(--ac);font-weight:600}
.it{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--bd)}.it:last-child{border:0}
.ck{width:30px;height:30px;border-radius:50%;border:2px solid var(--mut);background:none;padding:0;flex:none;color:#fff;font-size:17px;line-height:1}
.ck.on{background:var(--ok);border-color:var(--ok)}.done .t{text-decoration:line-through;color:var(--mut)}.t{flex:1}.em{font-size:24px;width:32px;text-align:center}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;color:var(--mut);border-radius:0;padding:14px}nav button.a{color:var(--ac);font-weight:600}
.msg{margin:8px 0;padding:10px 12px;border-radius:14px;max-width:94%;white-space:pre-wrap}.u{background:var(--ac);color:#fff;margin-left:auto}.b{background:var(--card);border:1px solid var(--bd)}
.mut{color:var(--mut);font-size:14px}.ls{max-height:190px;overflow:auto;font-size:14px;color:var(--mut);margin:6px 0 10px;padding-left:4px;list-style:none}
.chip{display:inline-block;margin:0 6px 8px 0;padding:8px 12px;border-radius:999px;background:var(--card);border:1px solid var(--bd);color:var(--tx)}
.due{font-size:13px;color:var(--mut)}.due.late{color:var(--bad)}
</style></head><body><header><div class="sb"><span>🔍</span><input id="sq" placeholder="Спроси или создай квест…" enterkeyhint="search"><button id="sg">Найти</button></div></header><div id="app"></div>
<nav><button id="n1">📋 Квесты</button><button id="n2">✨ Ассистент</button></nav>
<script>
const MCU=["Железный человек","Невероятный Халк","Железный человек 2","Тор","Первый мститель","Мстители","Железный человек 3","Тор 2: Царство тьмы","Первый мститель: Другая война","Стражи Галактики","Мстители: Эра Альтрона","Человек-муравей","Первый мститель: Противостояние","Доктор Стрэндж","Стражи Галактики 2","Человек-паук: Возвращение домой","Тор: Рагнарёк","Чёрная пантера","Мстители: Война бесконечности","Человек-муравей и Оса","Капитан Марвел","Мстители: Финал","Человек-паук: Вдали от дома","Чёрная вдова","Шан-Чи","Вечные","Человек-паук: Нет пути домой","Доктор Стрэндж 2","Тор: Любовь и гром","Чёрная пантера: Ваканда навеки","Человек-муравей 3","Стражи Галактики 3","Марвелы","Дэдпул и Росомаха","Капитан Америка: Дивный новый мир","Громовержцы*","Фантастическая четвёрка: Первые шаги"];
let S={quests:[],chat:[]},V={p:"list",id:null,f:"todo"},busy=false;
try{const r=localStorage.getItem("qs");if(r)S=JSON.parse(r)}catch(e){}
if(!S.quests.length&&!S.seeded){S.quests.push(mk("Все фильмы Marvel (MCU)",MCU.map(t=>({t,e:"🎬"}))));S.seeded=1}
function mk(title,arr,due){return{id:"q"+Date.now()+Math.random().toString(36).slice(2,5),title,due:due||"",items:arr.map(x=>typeof x=="string"?{t:x,e:"",d:false}:{t:String(x.t),e:x.e||"",d:false})}}
function save(){try{localStorage.setItem("qs",JSON.stringify(S))}catch(e){}}
function $(t,a,c){const e=document.createElement(t);if(a)Object.assign(e,a);(c||[]).forEach(x=>e.append(x));return e}
function go(p,id,f){V={p,id,f:f||"todo"};draw()}
function draw(){const A=document.getElementById("app");A.replaceChildren();
 n1.className=V.p!="ai"?"a":"";n2.className=V.p=="ai"?"a":"";
 if(V.p=="list")list(A);else if(V.p=="q")quest(A);else ai(A)}
function pct(q){return q.items.length?Math.round(q.items.filter(i=>i.d).length/q.items.length*100):0}
function dueT(q){if(!q.due)return null;const n=Math.ceil((new Date(q.due+"T23:59")-new Date())/864e5),d=new Date(q.due+"T00:00").toLocaleDateString("ru",{day:"numeric",month:"short"});
 const left=n<0?"просрочено":n==0?"сегодня":"ещё "+n+" дн.";return{t:"до "+d+" · "+left,late:n<0}}
function list(A){
 A.append($("h1",{textContent:"Мои квесты"}));
 S.quests.forEach(q=>{const dt=dueT(q);A.append($("div",{className:"card",onclick:()=>go("q",q.id)},[
  $("b",{textContent:q.title}),$("div",{className:"mut",textContent:q.items.filter(i=>i.d).length+" из "+q.items.length+" · "+pct(q)+"%"}),
  $("div",{className:"bar"},[$("i",{style:"width:"+pct(q)+"%"})]),
  dt?$("div",{className:"due"+(dt.late?" late":""),textContent:"⏰ "+dt.t}):""]))});
 if(!S.quests.length)A.append($("p",{className:"mut",textContent:"Пока пусто. Напиши в строке сверху, например: «18 домашних заданий до понедельника»."}));
 A.append($("button",{className:"g",textContent:"+ Пустой квест",onclick:()=>{const q=mk("Новый квест",[]);S.quests.unshift(q);save();go("q",q.id,"all")}}))}
function quest(A){
 const q=S.quests.find(x=>x.id==V.id);if(!q)return go("list");
 A.append($("button",{className:"g",textContent:"← Назад",onclick:()=>go("list")}));
 A.append($("input",{value:q.title,style:"font-size:20px;font-weight:700;margin:8px 0",onchange:e=>{q.title=e.target.value;save()}}));
 const dt=dueT(q);
 A.append($("div",{className:"row"},[$("span",{className:"mut",textContent:"Срок:"}),$("input",{type:"date",value:q.due||"",style:"width:auto",onchange:e=>{q.due=e.target.value;save();draw()}}),dt?$("span",{className:"due"+(dt.late?" late":""),textContent:dt.t}):$("span",{className:"mut",textContent:"без срока"})]));
 const nd=q.items.filter(i=>i.d).length;
 A.append($("div",{className:"mut",style:"margin-top:10px",textContent:nd+" из "+q.items.length+" выполнено"}),$("div",{className:"bar"},[$("i",{style:"width:"+pct(q)+"%"})]));
 const T=[["todo","Невыполненные",q.items.length-nd],["done","Выполненные",nd],["all","Все",q.items.length]];
 A.append($("div",{className:"tabs"},T.map(([k,l,n])=>$("button",{className:V.f==k?"a":"",textContent:l+" "+n,onclick:()=>{V.f=k;draw()}}))));
 const c=$("div",{className:"card"});let shown=0;
 q.items.forEach((i,k)=>{if(V.f=="todo"&&i.d||V.f=="done"&&!i.d)return;shown++;
  c.append($("div",{className:"it"+(i.d?" done":"")},[
   $("button",{className:"ck"+(i.d?" on":""),textContent:i.d?"✓":"",onclick:()=>{i.d=!i.d;save();draw()}}),
   $("span",{className:"em",textContent:i.e||""}),$("span",{className:"t",textContent:i.t}),
   $("button",{className:"d",textContent:"✕",onclick:()=>{q.items.splice(k,1);save();draw()}})]))});
 if(!shown)c.append($("span",{className:"mut",textContent:V.f=="done"?"Пока ничего не выполнено":V.f=="todo"?"Всё сделано 🎉":"Пусто"}));
 A.append(c);
 const ni=$("input",{placeholder:"Добавить пункт"});const add=()=>{if(ni.value.trim()){q.items.push({t:ni.value.trim(),e:"",d:false});save();draw()}};
 ni.onkeydown=e=>{if(e.key=="Enter")add()};
 A.append($("div",{className:"row"},[ni,$("button",{textContent:"+",onclick:add})]),
  $("button",{className:"d",textContent:"Удалить квест",onclick:()=>{if(confirm("Удалить квест?")){S.quests=S.quests.filter(x=>x!=q);save();go("list")}}}))}
function ai(A){
 A.append($("h1",{textContent:"Ассистент"}));
 if(!S.chat.length){A.append($("p",{className:"mut",textContent:"Напиши в строке сверху или выбери:"}));
  ["Все фильмы Marvel","18 домашних заданий до понедельника","Убрать комнату за выходные","Топ-100 фильмов"].forEach(x=>A.append($("span",{className:"chip",textContent:x,onclick:()=>ask(x)})))}
 S.chat.forEach(m=>{const d=$("div",{className:"msg "+(m.r=="u"?"u":"b")},[document.createTextNode(m.t)]);
  if(m.items&&m.items.length){const ul=$("ul",{className:"ls"});m.items.forEach(x=>ul.append($("li",{textContent:(x.e||"")+" "+x.t})));
   d.append(ul,$("button",{textContent:"➕ Составить квест ("+m.items.length+")"+(m.due?" · до "+m.due:""),onclick:()=>{const q=mk(m.title||"Новый квест",m.items,m.due);S.quests.unshift(q);save();go("q",q.id)}}))}
  A.append(d)});
 if(busy)A.append($("div",{className:"msg b mut",textContent:"Думаю…"}));
 if(S.chat.length&&!busy)A.append($("button",{className:"g",textContent:"Очистить чат",onclick:()=>{S.chat=[];save();draw()}}));
 setTimeout(()=>window.scrollTo(0,document.body.scrollHeight),0)}
function call(p){return fetch("/api/chat",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({prompt:p})}).then(x=>{if(!x.ok)throw{code:"http"};return x.json()})}
async function ask(t){t=(t||"").trim();if(!t||busy)return;sq.value="";
 S.chat.push({r:"u",t});busy=true;save();go("ai");
 try{
  const hist=S.chat.slice(-7,-1).map(m=>(m.r=="u"?"Пользователь: ":"Ассистент: ")+m.t).join("\n");
  const now=new Date(),day=now.toLocaleDateString("ru",{weekday:"long"});
  const r=await call("Сегодня "+now.toISOString().slice(0,10)+" ("+day+"). Ты ассистент в приложении-трекере квестов. Отвечай по-русски, кратко и честно; если не уверен в числе, скажи об этом. Если запрос про набор дел, уроков, фильмов, книг и т.п., верни пункты в items: [{t:название,e:один подходящий эмодзи}]. Если пользователь просит N заданий без названий, придумай осмысленные пункты сам. Длинные точные списки (фильмы) давай полностью по порядку. due — дата YYYY-MM-DD только если пользователь назвал срок (например «до понедельника» — ближайший понедельник), иначе \"\". Для обычных вопросов items=[]. Верни ТОЛЬКО JSON: {\"answer\":string,\"title\":string,\"due\":string,\"items\":[{\"t\":string,\"e\":string}]}.\nИстория:\n"+hist+"\nЗапрос: "+t,{cache:false});
  S.chat.push({r:"b",t:r.answer||"Готово",title:r.title,due:r.due||"",items:Array.isArray(r.items)?r.items:[]})
 }catch(e){S.chat.push({r:"b",t:e&&(e.code=="not_granted"||e.code=="no")?"Ассистент сейчас недоступен, попробуй позже.":"Не получилось ответить, попробуй ещё раз."})}
 busy=false;save();draw()}
sq.onkeydown=e=>{if(e.key=="Enter")ask(sq.value)};sg.onclick=()=>ask(sq.value);
n1.onclick=()=>go("list");n2.onclick=()=>go("ai");draw();
</script></body></html>
